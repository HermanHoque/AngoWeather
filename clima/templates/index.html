{% load static %}
<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngoWeather - Previsão do Tempo</title>
    <!-- Favicon para a aba do navegador -->
    <link rel="icon" type="image/png" href="{% static 'img/angoweather.png' %}">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome 6 via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

  <body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- TOPBAR HEADER COM LOGO -->
    <header class="w-full max-w-4xl mx-auto px-4 py-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <!-- Imagem do Logo -->
        <img 
          src="{% static 'img/angoweather.png' %}" 
          alt="AngoWeather Logo" 
          class="h-12 w-auto object-contain rounded-xl shadow-md">
        <div>
          <h1 class="text-xl font-bold tracking-wide text-white"><span class="text-blue-500">Ango</span>Weather</h1>
          <p class="text-xs text-slate-400">Tempo em tempo real nas 18 Províncias</p>
        </div>
      </div>
      
      <span id="badge-location" class="text-xs bg-slate-800 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-full flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> A localizar...
      </span>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="w-full max-w-2xl mx-auto px-4 my-auto py-6">

      <!-- ÁREA DE PESQUISA COM AUTOCOMPLETAR -->
      <section class="relative mb-8">
        <div class="relative">
          <input 
            type="text" 
            id="search-input"
            placeholder="Pesquisar província ou cidade (ex: Luanda)..."
            class="w-full bg-slate-800/80 backdrop-blur border border-slate-700 text-white placeholder-slate-400 rounded-2xl px-5 py-4 pl-12 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-xl"
            autocomplete="off"
          >
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
        </div>

        <!-- Caixa de Sugestões / Autocompletar -->
        <ul id="suggestions" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden divide-y divide-slate-700/50">
          <!-- Inserido dinamicamente pelo JS -->
        </ul>
      </section>

      <!-- CARTÃO PRINCIPAL DE CLIMA -->
      <section id="weather-card" class="bg-gradient-to-br from-blue-600 to-indigo-800 rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/10 relative overflow-hidden transition-all duration-300">
        
        <div id="loading-state" class="py-12 text-center text-blue-100 font-medium flex flex-col items-center gap-3">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-white"></i>
          <span>Obtendo coordenadas do seu navegador...</span>
        </div>

        <div id="weather-content" class="hidden">
          <!-- Cabeçalho do Cartão -->
          <div class="flex justify-between items-start mb-6">
            <div>
              <span id="tag-origin" class="text-xs font-semibold tracking-wider uppercase bg-white/20 text-white px-2.5 py-1 rounded-md mb-2 inline-block">
                Sua Localização
              </span>
              <h2 id="city-name" class="text-3xl font-bold text-white">--</h2>
              <p id="weather-date" class="text-sm text-blue-100/80">Hoje</p>
            </div>
            <!-- Ícone Clima Principal (FontAwesome) -->
            <div id="weather-icon-box" class="text-5xl text-amber-300 drop-shadow-md">
              <i id="weather-icon" class="fa-solid fa-sun"></i>
            </div>
          </div>

          <!-- Temperatura e Condição -->
          <div class="mb-8">
            <div class="flex items-baseline gap-2">
              <span id="temp-val" class="text-6xl font-extrabold text-white">--</span>
              <span class="text-3xl font-light text-blue-200">°C</span>
            </div>
            <p id="weather-desc" class="text-lg text-blue-100 mt-1 capitalize">Carregando...</p>
          </div>

          <!-- Métricas (Vento e Direção) -->
          <div class="grid grid-cols-2 gap-4 bg-black/20 backdrop-blur-md rounded-2xl p-4 border border-white/5">
            
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl text-blue-200">
                <i class="fa-solid fa-wind"></i>
              </div>
              <div>
                <p class="text-xs text-blue-200">Vento</p>
                <p id="wind-speed" class="text-sm font-semibold text-white">-- km/h</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl text-blue-200">
                <i class="fa-solid fa-compass"></i>
              </div>
              <div>
                <p class="text-xs text-blue-200">Direção do Vento</p>
                <p id="wind-dir" class="text-sm font-semibold text-white">--°</p>
              </div>
            </div>

          </div>
        </div>
      </section>

    </main>

  <!-- RODAPÉ ATUALIZADO -->
  <footer class="w-full text-center py-6 text-xs text-slate-500 border-t border-slate-800 flex flex-col items-center gap-2">
    <div class="flex items-center gap-4">
      <!-- Link para o perfil ou repositório do GitHub -->
      <a 
        href="https://github.com/HermanHoque" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="text-slate-400 hover:text-white text-lg transition-colors flex items-center gap-2"
        title="Ver projeto no GitHub"
      >
        <i class="fa-brands fa-github"></i>
        <span class="text-xs font-medium">GitHub</span>
      </a>
    </div>
    <p>AngoWeather &copy; By: Herman Hoque</p>
  </footer>

    <!-- LÓGICA JAVASCRIPT DA INTERFACE -->
    <script src="{% static 'js/js.js' %}"></script>
  </body>
</html>
